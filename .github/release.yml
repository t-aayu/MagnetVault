changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security & Custom DNS
      labels:
        - security
        - dns
    - title: Documentation & Maintenance
      labels:
        - documentation
        - chore
    - title: Other Changes
      labels:
        - '*'
