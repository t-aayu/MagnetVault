name: Release Android App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.awt.headless=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine release tag and version metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore optional google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > app/google-services.json

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [[ -f debug.keystore.base64 ]]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android Lint and full JVM/Robolectric suite
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:lintDebug :app:testDebugUnitTest

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [[ "$HAS_KEYSTORE" == "true" && "$HAS_STORE_PASS" == "true" && "$HAS_KEY_PASS" == "true" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and validate release keystore (alias=upload)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload > /dev/null

      - name: Build signed Release APK & AAB
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:assembleRelease :app:bundleRelease

      - name: Verify signed Release APK & AAB
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -n "$APKSIGNER" && -x "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          fi
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Build Debug APK fallback (when release signing secrets are absent)
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:assembleDebug

      - name: Stage release artifacts and SHA-256 checksums
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p release-artifacts
          if [[ "$SIGNED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/MagnetVault-${TAG}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/MagnetVault-${TAG}-release.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/MagnetVault-${TAG}-debug.apk"
          fi
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -lh release-artifacts

      - name: Build release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/release-notes.md"
          import os, re
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          signed = os.environ["SIGNED"] == "true"
          notes = []
          if os.path.exists("CHANGELOG.md"):
              text = open("CHANGELOG.md", encoding="utf-8").read()
              pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if m:
                  notes.append(m.group(1).strip())
          if not notes:
              notes.append(f"Release {tag} of MagnetVault.")
          if not signed:
              notes.append("\n> **Note**: Release signing secrets were not configured, so this tag attached the debug APK fallback.")
          if os.path.exists("release-artifacts/SHA256SUMS.txt"):
              sums = open("release-artifacts/SHA256SUMS.txt", encoding="utf-8").read().strip()
              notes.append(f"\n### SHA-256 Checksums\n```text\n{sums}\n```")
          print("\n".join(notes))
          PY

      - name: Clean up temporary keystores and decoded configs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/my-upload-key.jks" debug.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MagnetVault ${{ steps.meta.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            release-artifacts/*
