name: Release Android App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine release tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid release tag format" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Restore optional google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [[ -f debug.keystore.base64 ]]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [[ "$HAS_KEYSTORE" == "true" && "$HAS_STORE_PASS" == "true" && "$HAS_KEY_PASS" == "true" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build signed Release APK & AAB
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Build Debug APK fallback (unsigned release secrets not configured)
        if: steps.signing.outputs.signed != 'true'
        run: gradle :app:assembleDebug

      - name: Stage release artifacts and SHA-256 checksums
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p release-artifacts
          if [[ "$SIGNED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/MagnetVault-${TAG}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/MagnetVault-${TAG}-release.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/MagnetVault-${TAG}-debug.apk"
          fi
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -lh release-artifacts

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/my-upload-key.jks" debug.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MagnetVault ${{ steps.meta.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            release-artifacts/*
