name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Unit & Robolectric Tests, Debug APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.awt.headless=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [[ -f debug.keystore.base64 ]]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android Lint
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:lintDebug

      - name: Run full JVM and Robolectric test suite (deterministic fixtures)
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:testDebugUnitTest

      - name: Build Debug APK & generate SHA-256 checksum
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:assembleDebug
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetVault-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14

      - name: Clean up debug keystore
        if: always()
        run: rm -f debug.keystore

  no-firebase-smoke:
    name: No-Firebase Build Smoke Check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.awt.headless=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore & ensure google-services.json absent
        shell: bash
        run: |
          rm -f app/google-services.json
          if [[ -f debug.keystore.base64 ]]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and verify local-only app without Firebase config
        shell: bash
        run: |
          GRADLE_BIN=$([[ -x ./gradlew ]] && echo "./gradlew" || echo "gradle")
          $GRADLE_BIN :app:assembleDebug :app:testDebugUnitTest --tests "com.example.Phase2LocalVaultTest"

      - name: Clean up debug keystore
        if: always()
        run: rm -f debug.keystore

  firestore-emulator:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI & Rules Unit Testing dependencies
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing

      - name: Run Firestore security rules tests against emulator
        run: firebase emulators:exec --only firestore "node --test firestore.test.js"
